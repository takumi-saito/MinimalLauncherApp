name: Claude Assistant
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude-response:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Android Build Environment
        uses: ./.github/actions/setup-android-build
        with:
          google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Decode Google Private Key
        id: decode_key
        if: ${{ env.GOOGLE_PRIVATE_KEY_BASE64 != '' }}
        env:
          GOOGLE_PRIVATE_KEY_BASE64: ${{ secrets.GOOGLE_PRIVATE_KEY_BASE64 }}
        run: |
          DECODED_KEY=$(echo "$GOOGLE_PRIVATE_KEY_BASE64" | base64 -d)
          echo "DECODED_PRIVATE_KEY<<EOF" >> $GITHUB_OUTPUT
          echo "$DECODED_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: anthropics/claude-code-action@beta
        with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Or use OAuth token instead:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_tools: "Bash(./gradlew:*),Bash(gradlew:*),Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Read(**),Write(**),Edit(**),MultiEdit(**),Grep(**),Glob(**),LS(**),mcp__google-analytics__getActiveUsers,mcp__google-analytics__runReport,mcp__google-analytics__getPageViews,mcp__google-analytics__getEvents,mcp__google-analytics__getUserBehavior"
          mode: "tag"
          trigger_phrase: "@claude"
          mcp_config: |
            {
              "mcpServers": {
                "google-analytics": {
                  "command": "npx",
                  "args": [
                    "-y",
                    "mcp-server-google-analytics"
                  ],
                  "env": {
                    "GOOGLE_CLIENT_EMAIL": "${{ secrets.GOOGLE_CLIENT_EMAIL }}",
                    "GOOGLE_PRIVATE_KEY": "${{ secrets.GOOGLE_PRIVATE_KEY }}",
                    "GA_PROPERTY_ID": "${{ secrets.GA_PROPERTY_ID }}"
                  }
                }
              }
            }
          custom_instructions: |
            必ず日本語で回答してください。技術用語は英語のままで構いません。
