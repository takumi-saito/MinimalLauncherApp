name: Deploy Google Play Console

on:
  push:
    branches:
      - release

jobs:
  deploy-google-play-console:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode and save google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          echo "google-services.json has been created successfully"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore keystore.jks
        run: |
          echo "${{ secrets.RELEASE_JKS_BASE64 }}" | base64 -d > app/release.jks
          ls -l app/release.jks

      - name: Restore keystore.properties
        run: |
          echo "${{ secrets.KEYSTORE_PROPERTIES }}" > keystore.properties
          cat keystore.properties

      - name: Build AAB
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # サービスアカウント作成
      - name: Create service_account.json
        id: createServiceAccount
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      # deploy
      - name: Deploy to Play Store
        id: deploy
        uses: r0adkll/upload-google-play@v1.0.15
        with:
          serviceAccountJson: service_account.json
          packageName: com.kireaji.minimallauncherapp
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          whatsNewDirectory: distribution/whatsnew
      # slack
      - uses: 8398a7/action-slack@v2.5.2
        if: failure()
        with:
          status: ${{ job.status }}
          text: リリースビルドが失敗しました。確認をお願いします。
          mention: 'here'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
      - uses: 8398a7/action-slack@v2.5.2
        if: success()
        with:
          status: ${{ job.status }}
          text: リリースビルドが完了しました！
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}