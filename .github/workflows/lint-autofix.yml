name: Android Lint Auto Fix (Claude Code)

on:
  schedule:
    - cron: "0 17 * * *"   # JST 02:00 実行
  workflow_dispatch:

jobs:
  lint-autofix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Android Build Environment
      uses: ./.github/actions/setup-android-build
      with:
        google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    - name: Run Android Lint
      run: ./gradlew lintDebug

    - name: Install xmllint
      run: sudo apt-get update && sudo apt-get install -y libxml2-utils

    - name: Parse Lint XML
      id: parse
      run: |
        REPORT=app/build/reports/lint-results-debug.xml

        ISSUE_ID=$(xmllint --xpath \
          "string((//issue[@severity='Error'] | //issue[@severity='Warning'])[1]/@id)" \
          $REPORT 2>/dev/null || echo "")

        echo "issue_file=$REPORT" >> $GITHUB_OUTPUT

        if [ -z "$ISSUE_ID" ]; then
          echo "No Lint issues found."
          echo "has_issue=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Found Lint Issue: $ISSUE_ID"
        echo "issue_id=$ISSUE_ID" >> $GITHUB_OUTPUT
        echo "has_issue=true" >> $GITHUB_OUTPUT

        # Issue の詳細を抽出
        ISSUE_XML=$(xmllint --xpath "(//issue[@id='$ISSUE_ID'])[1]" $REPORT 2>/dev/null || echo "")

        # message と location を抽出
        MESSAGE=$(echo "$ISSUE_XML" | xmllint --xpath "string(//issue/@message)" - 2>/dev/null || echo "")
        FILE=$(echo "$ISSUE_XML" | xmllint --xpath "string(//location/@file)" - 2>/dev/null || echo "")
        LINE=$(echo "$ISSUE_XML" | xmllint --xpath "string(//location/@line)" - 2>/dev/null || echo "")

        echo "message=$MESSAGE" >> $GITHUB_OUTPUT
        echo "file=$FILE" >> $GITHUB_OUTPUT
        echo "line=$LINE" >> $GITHUB_OUTPUT

        {
          echo "issue_content<<EOF"
          echo "$ISSUE_XML"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: ${{ steps.parse.outputs.issue_file }}

    - name: Create GitHub Issue
      id: create_issue
      if: steps.parse.outputs.has_issue == 'true'
      uses: actions/github-script@v7
      env:
        ISSUE_ID: ${{ steps.parse.outputs.issue_id }}
        ISSUE_MESSAGE: ${{ steps.parse.outputs.message }}
        ISSUE_FILE: ${{ steps.parse.outputs.file }}
        ISSUE_LINE: ${{ steps.parse.outputs.line }}
        ISSUE_CONTENT: ${{ steps.parse.outputs.issue_content }}
      with:
        script: |
          const issueId = process.env.ISSUE_ID;
          const message = process.env.ISSUE_MESSAGE;
          const file = process.env.ISSUE_FILE;
          const line = process.env.ISSUE_LINE;
          const content = process.env.ISSUE_CONTENT;

          const body = `## Android Lint Issue

          **Issue ID:** \`${issueId}\`
          **Message:** ${message}
          **File:** \`${file}\`
          **Line:** ${line}

          ### 詳細 (XML)
          \`\`\`xml
          ${content}
          \`\`\`

          ---
          *This issue was automatically created by Android Lint Auto Fix workflow.*
          `;

          const issue = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `[Lint] ${issueId}`,
            body: body,
            labels: ['lint', 'automated']
          });
          core.setOutput('issue_number', issue.data.number);
          console.log(`Created issue #${issue.data.number}`);

    - name: Claude Code Auto Fix
      if: steps.parse.outputs.has_issue == 'true'
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        direct_prompt: |
          Android Lint で検出された Issue を **1件だけ** 修正してください。

          ## 修正対象
          - Issue ID: **${{ steps.parse.outputs.issue_id }}**
          - GitHub Issue: #${{ steps.create_issue.outputs.issue_number }}

          ## Issue の詳細 (XML)
          ```xml
          ${{ steps.parse.outputs.issue_content }}
          ```

          ## 必須ルール
          - 上記の Issue **1件のみ** を修正すること
          - 修正後、以下のブランチ名で commit & push してください:
            `auto/lint-${{ steps.create_issue.outputs.issue_number }}-${{ steps.parse.outputs.issue_id }}`
          - commit メッセージに `Closes #${{ steps.create_issue.outputs.issue_number }}` を含めてください
          - PR の diff は最小限にし、不要なリファクタは行わない
          - コードスタイルは既存に合わせる

          XML 内の location 要素に記載されたファイルパスと行番号を参照して修正してください。
