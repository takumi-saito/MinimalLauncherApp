name: Android Lint Auto Fix (Claude Code)

on:
  schedule:
    - cron: "0 17 * * *"   # JST 02:00 実行
  workflow_dispatch:

jobs:
  lint-autofix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Android Build Environment
      uses: ./.github/actions/setup-android-build
      with:
        google-services-json-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

    - name: Run Android Lint
      run: ./gradlew lintDebug

    - name: Parse Lint XML
      id: parse
      run: |
        REPORT=app/build/reports/lint-results-debug.xml

        # デバッグ: レポートファイルの存在確認
        echo "=== Debug: Checking report file ==="
        ls -la $REPORT || echo "Report file not found!"

        # デバッグ: xmllint バージョン確認
        echo "=== Debug: xmllint version ==="
        xmllint --version 2>&1 || echo "xmllint not found"

        # デバッグ: XML の先頭を確認
        echo "=== Debug: XML head ==="
        head -10 $REPORT

        # デバッグ: grep で issue タグがあるか確認
        echo "=== Debug: grep issue count ==="
        grep -c '<issue' $REPORT || echo "No issue tags found"

        # デバッグ: xmllint エラー出力を確認
        echo "=== Debug: xmllint with stderr ==="
        xmllint --xpath '//issue[1]/@id' $REPORT 2>&1 || echo "xpath failed"

        # Issue ID を抽出（最初の Error または Warning）
        ISSUE_ID=$(xmllint --xpath \
          "string((//issue[@severity='Error'] | //issue[@severity='Warning'])[1]/@id)" \
          $REPORT 2>/dev/null || echo "")

        # レポートファイルパスは常に出力
        echo "issue_file=$REPORT" >> $GITHUB_OUTPUT

        if [ -z "$ISSUE_ID" ]; then
          echo "No Lint issues found."
          echo "has_issue=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Found Lint Issue: $ISSUE_ID"
        echo "issue_id=$ISSUE_ID" >> $GITHUB_OUTPUT
        echo "has_issue=true" >> $GITHUB_OUTPUT

        # 該当 Issue の詳細を抽出して保存
        xmllint --xpath "(//issue[@id='$ISSUE_ID'])[1]" $REPORT > /tmp/issue_detail.xml 2>/dev/null || true

        # Issue の内容を出力用に整形
        {
          echo "issue_content<<EOF"
          cat /tmp/issue_detail.xml
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: ${{ steps.parse.outputs.issue_file }}

    - name: Claude Code Auto Fix
      if: steps.parse.outputs.has_issue == 'true'
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        commit_style: "always_pr"
        pull_request_title: "chore(lint): Fix ${{ steps.parse.outputs.issue_id }}"
        pull_request_branch: "auto/lint-${{ steps.parse.outputs.issue_id }}"
        prompt: |
          Android Lint で検出された Issue を **1件だけ** 修正してください。

          ## 修正対象
          - Issue ID: **${{ steps.parse.outputs.issue_id }}**

          ## Issue の詳細 (XML)
          ```xml
          ${{ steps.parse.outputs.issue_content }}
          ```

          ## 必須ルール
          - 上記の Issue **1件のみ** を修正すること
          - PR の diff は最小限にし、不要なリファクタは行わない
          - コードスタイルは既存に合わせる
          - 他の Issue は絶対に触れないこと

          XML 内の location 要素に記載されたファイルパスと行番号を参照して修正してください。