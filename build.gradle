buildscript {
    dependencies {
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.4'
        classpath 'com.google.firebase:perf-plugin:1.4.2'  // Performance Monitoring plugin
//        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.44'
    }
}
// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.10.1' apply false
    id 'com.android.library' version '8.10.1' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    id 'com.google.devtools.ksp' version '1.9.24-1.0.20' apply false
    id 'com.google.dagger.hilt.android' version '2.51.1' apply false
    // VRT。1.47.0 は Kotlin 1.9.24 と互換な最終版（1.48.0+ は kotlin-stdlib 2.0.21 で
    // メタデータ非互換）。Kotlin 2.x に上げるまでここは動かせない。詳細は docs/vrt.md。
    id 'io.github.takahirom.roborazzi' version '1.47.0' apply false
}